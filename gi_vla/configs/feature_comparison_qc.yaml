    g_e03_mid_static_dense:
      level: e03
      source: qwen3_vl_visual_block_11_output_pre_merger
      expected_tokens: 256
      expected_dim: 1024
      expected_grid: [16, 16]

data:
  dataset_root: bbox_vla/raw_data/task1_5_all
